[package]
name = "gulikit-ui"
version.workspace = true
edition = "2024"
rust-version = "1.98"

[lints]
workspace = true

[dependencies]
gulikit-core = { path = "../core" }
gulikit-platform = { path = "../platform" }
gulikit-updater = { path = "../.." }
gulikit-archive = { path = "../archive" }
rfd = "=0.17.2"
serde_json = "1"
slint = { version = "=1.18.1", default-features = false, features = [
  "std",
  "backend-winit",
  "renderer-software",
  "accessibility",
  "compat-1-18",
] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31.3", features = ["user"] }
slint = { version = "=1.18.1", default-features = false, features = [
  "unstable-winit-030",
] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
tempfile = "3"
# Slint's preliminary testing API requires the exact same version as Slint.
i-slint-backend-testing = { version = "=1.18.1", features = [
  "renderer-software",
] }
