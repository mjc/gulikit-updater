[package]
name = "gulikit-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
gulikit-core = { path = "../core" }
gulikit-platform = { path = "../platform" }
gulikit-updater = { path = "../.." }
rfd = "=0.17.2"
serde_json = "1"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-18"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
tempfile = "3"
# Slint's preliminary testing API requires the exact same version as Slint.
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
