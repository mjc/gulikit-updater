[package]
name = "gulikit-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
gulikit-core = { path = "../core" }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
rusb = "=0.9.4"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"
