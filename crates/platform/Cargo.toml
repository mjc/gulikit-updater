[package]
name = "gulikit-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[lints]
workspace = true

[dependencies]
gulikit-catalog = { path = "../catalog" }
gulikit-core = { path = "../core" }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tempfile = "3"
sha2 = "0.11"
hex = "0.4"
ureq = { version = "3.4.2", default-features = false, features = [
  "rustls",
  "platform-verifier",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "signal", "process"] }
rustix = { version = "1.1.5", features = ["net", "time"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
