[package]
name = "gulikit-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
gulikit-core = { path = "../core" }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "signal", "process"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
