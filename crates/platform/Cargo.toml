[package]
name = "gulikit-platform"
version.workspace = true
edition = "2024"
rust-version = "1.98"

[lints]
workspace = true

[dependencies]
gulikit-core = { path = "../core" }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "signal", "process", "user"] }
rustix = { version = "1.1.5", features = ["net", "time"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
