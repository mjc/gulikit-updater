[package]
name = "gulikit-archive"
version.workspace = true
edition = "2024"
rust-version = "1.98"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
sha2 = "0.11"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
clap = { version = "4.6", features = ["derive"] }
url = "2"
ureq = { version = "3.4.2", default-features = false, features = [
  "rustls",
  "platform-verifier",
] }
gulikit-core = { path = "../core" }
object = { version = "0.40", default-features = false, features = [
  "read_core",
  "pe",
  "std",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs"] }

[dev-dependencies]
assert_cmd = "2"
