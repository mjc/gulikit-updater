name: Check
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Treefmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
      - name: Check formatting with the pinned environment
        run: nix run github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222 -- shell -- treefmt --fail-on-change --no-cache
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux font dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --bins --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - name: Render the release UI
        run: cargo test --release -p gulikit-ui --bin gulikit-ui --locked desktop_renders_both_components_and_routes_confirmed_inspection
      - run: cargo test --workspace --doc --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Exercise macOS bundle and signing guards
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      - name: Build macOS release executables
        if: runner.os == 'macOS'
        run: bash scripts/build_macos.sh
      - name: Smoke-test macOS release packaging without distribution credentials
        if: runner.os == 'macOS'
        run: python3 scripts/package_macos.py smoke --binaries target/release --arch "$(uname -m)"
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      - name: Build Windows release with the static runtime
        if: runner.os == 'Windows'
        run: cargo build --release --workspace --bins --locked --target x86_64-pc-windows-msvc
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Smoke-test extracted unsigned Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./scripts/package_windows.ps1 -Binaries target/x86_64-pc-windows-msvc/release
      - name: Retain the checked Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x86_64-unsigned
          path: artifacts/distribution/*
          if-no-files-found: error
          retention-days: 14
  research:
    name: Research harness guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -r research/requirements.txt
      - run: .venv/bin/python -O -m unittest discover -s research -p 'test_*.py'
