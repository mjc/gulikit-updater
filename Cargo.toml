[package]
name = "gulikit-updater"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace]
members = ["crates/core", "crates/platform", "crates/ui"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.clippy]
collection_is_never_read = "deny"
debug_assert_with_mut_call = "deny"
fallible_impl_from = "deny"
needless_collect = "deny"
needless_pass_by_ref_mut = "deny"
or_fun_call = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
redundant_clone = "deny"
significant_drop_in_scrutinee = "deny"
too_long_first_doc_paragraph = "deny"
unused_peekable = "deny"

[lints]
workspace = true

[dependencies]
gulikit-core = { path = "crates/core" }
gulikit-platform = { path = "crates/platform" }
clap = { version = "4.6", features = ["derive"] }
serde.workspace = true
serde_json = "1"
ctrlc = "3.5.2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
