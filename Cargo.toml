[package]
name = "gulikit-updater"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace]
members = ["crates/core", "crates/platform"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dependencies]
gulikit-core = { path = "crates/core" }
gulikit-platform = { path = "crates/platform" }
clap = { version = "4.6", features = ["derive"] }
serde.workspace = true
serde_json = "1"
ctrlc = "3.5.2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
